name: Deploy to Firebase Hosting on merge
env:
  FLUTTER_HOME: "$HOME/flutter" 
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
      - uses: actions/checkout@v4
      - name: build
      - run: echo "Cloning Flutter SDK..."
      - run: sudo git clone https://github.com/flutter/flutter.git --depth 1 -b stable ${{ env.FLUTTER_HOME }}
      - run: echo "Installing Flutter project dependencies..."
      - run: flutter pub get
      - run: flutter build web
      - name: deploy
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MINDFUL_PHALANX_473719_J7 }}
          channelId: live
          projectId: mindful-phalanx-473719-j7
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
